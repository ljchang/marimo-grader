# Builds and pushes the two production images to GHCR on every push to main
# and on version tags. deploy/deploy.sh on the droplet pulls them by tag.
#
#   ghcr.io/ljchang/marimo-grader-backend   (backend/Dockerfile; web + worker + migrate)
#   ghcr.io/ljchang/marimo-grader-web       (deploy/web/Dockerfile; Caddy + built frontend)
#
# Tags produced per image: sha-<short>, <branch> (e.g. main), and for v1.2.3
# tags: 1.2.3, 1.2, latest.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/ljchang/marimo-grader-backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: web
            image: ghcr.io/ljchang/marimo-grader-web
            context: .
            dockerfile: deploy/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # release-client.yml makes the same check before publishing the client.
      # Without it a `v0.1.2` tag would happily build images from a tree whose
      # backend still says 0.1.0, and nothing downstream would notice.
      - name: On a version tag, check it matches backend/pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml | head -1)"
          test "$tag" = "$ver" || { echo "tag $tag != backend/pyproject.toml $ver"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
