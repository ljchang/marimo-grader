# release-drafter config — https://github.com/release-drafter/release-drafter
#
# Maintains a single draft Release on github.com/ljchang/marimo-grader/releases
# that is updated whenever a PR merges to main. The draft accumulates entries
# categorised by PR label; publishing it tags the commit, and that `v*` tag
# makes images.yml build `0.1.1` / `0.1` / `latest` images for the droplet to
# pull. The client package releases separately on `client-v*` tags.
#
# Mirrors ljchang/marimo-book's config so the two projects release the same way.

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Added"
    labels:
      - "enhancement"
      - "feature"
  - title: "Changed"
    labels:
      - "change"
      - "refactor"
      - "performance"
  - title: "Fixed"
    labels:
      - "bug"
      - "fix"
  - title: "Security"
    labels:
      - "security"
  - title: "Removed"
    labels:
      - "removal"
      - "breaking"
  - title: "Documentation"
    labels:
      - "documentation"
      - "docs"
  - title: "Build & CI"
    labels:
      - "ci"
      - "build"
      - "dependencies"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

# Resolve the next version from labels: while we are 0.x, `breaking` and
# feature work take the minor, everything else the patch.
version-resolver:
  major:
    labels: ["major"]
  minor:
    labels: ["breaking", "feature", "enhancement"]
  patch:
    labels: ["bug", "fix", "security", "documentation", "ci", "build"]
  default: patch

exclude-labels:
  - "skip-changelog"
exclude-contributors:
  - "dependabot"

template: |
  ## What's changed

  $CHANGES

  **Full diff:** https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
