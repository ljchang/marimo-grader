[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grader-server"
version = "0.1.1"
description = "Multi-tenant grading service for marimo assignments (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Luke Chang", email = "luke.j.chang@dartmouth.edu" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "python3-saml>=1.16",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "lzstring>=1.0.4",
]

[project.optional-dependencies]
worker = ["mograder>=0.3", "marimo>=0.21"]

[project.scripts]
grader-api = "grader.main:run"
grader-worker = "grader.worker.main:run"
grader = "grader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grader"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
