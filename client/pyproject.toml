[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marimo-grader-client"
version = "0.2.2"
description = "Notebook-side client for the dartbrains grader: sign-in, submit and feedback widgets for marimo"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Luke Chang", email = "luke.j.chang@dartmouth.edu" }]
dependencies = [
    "anywidget>=0.9",
    "traitlets",
    # marimo_grader_client.storage talks to R2 through obstore. It ships no
    # Pyodide wheel, so the marker keeps it out of the browser (where storage
    # is not available anyway); molab and local kernels get it.
    "obstore>=0.6; sys_platform != 'emscripten'",
]

[project.optional-dependencies]
mograder = ["mograder>=0.3"]

[dependency-groups]
# numpy/pandas/marimo: exercised by the storage tests (put/get by extension, the sign-in button).
dev = ["pytest>=8", "ruff", "numpy", "pandas", "marimo>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/marimo_grader_client"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Rebuild the editable/path install whenever the sources change (uv only watches pyproject.toml by default).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
