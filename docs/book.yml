# Documentation site for marimo-grader, built with marimo-book.
# Published at https://marimograder.org/ by .github/workflows/docs.yml (GitHub Pages, custom domain via CNAME).

title: marimo-grader
description: Sign in, submit, and grade marimo notebook assignments from the browser, MoLab, a cluster, or a laptop.
authors:
  - name: Luke Chang
    affiliation: Dartmouth College
copyright: "2026"
license: MIT
repo: https://github.com/ljchang/marimo-grader
branch: main
url: https://marimograder.org/

# Same palette and type as marimobook.org so the two projects read as a family.
theme:
  palette:
    primary: "#6366f1"   # indigo 500
    accent:  "#818cf8"   # indigo 400
  font:
    text: Geist
    code: Geist Mono

# Most pages are Markdown. The two demo pages carry a real assignment notebook,
# which opens in marimo-book's workbench drawer and runs in the reader's browser
# -- so there is still nothing for the header's launch buttons to launch.
launch_buttons:
  molab: false
  github: false
  download: false

dependencies:
  mode: env

toc:
  # Without an explicit title MkDocs takes the nav label from the page's first
  # H1, so the sidebar reads "marimo-grader" directly under the site name.
  # (It only falls back to "Home" when it finds no H1 at all, which is what
  # happens on books that leave launch_buttons on: the button markup lands
  # above the heading and hides it.)
  - file: content/index.md
    title: Home

  - section: Try it
    children:
      - file: content/demo/try-an-assignment.md
      # The demo assignment opens in the workbench drawer and runs in the
      # reader's browser. It carries no `grader-server` key, so it is a real
      # student notebook with no grading server behind it: Check runs, nothing
      # is submitted anywhere.
        assignment: content/demo/assignment.py
      - file: content/demo/what-the-instructor-wrote.md

  - section: How it works
    children:
      - file: content/how-it-works/concepts.md
      - file: content/how-it-works/life-of-a-submission.md
      - file: content/how-it-works/grading-engine.md

  - section: For students
    children:
      - file: content/students/open-an-assignment.md
      - file: content/students/sign-in-and-submit.md
      - file: content/students/feedback-and-grades.md

  - section: For instructors
    children:
      - file: content/instructors/author-an-assignment.md
      - file: content/instructors/publish.md
      - file: content/instructors/roster-and-staff.md
      - file: content/instructors/grading.md
      - file: content/instructors/canvas-export.md
      - file: content/instructors/change-log.md

  - section: Authentication
    children:
      - file: content/auth/index.md
      - file: content/auth/notebook-sign-in.md
      - file: content/auth/saml.md
      - file: content/auth/email-links.md
      - file: content/auth/sessions-and-tokens.md

  - section: Deploy and operate
    children:
      - file: content/operators/overview.md
      - file: content/operators/deploy.md
      - file: content/operators/email-delivery.md
      - file: content/operators/sandbox-and-data.md
      - file: content/operators/staging.md
      - file: content/operators/backups-and-upgrades.md
      - file: content/operators/troubleshooting.md
      - file: content/operators/security-model.md

  - section: Reference
    children:
      - file: content/reference/cli.md
      - file: content/reference/configuration.md
      - file: content/reference/notebook-metadata.md
      - file: content/reference/api.md
      - file: content/reference/design.md
